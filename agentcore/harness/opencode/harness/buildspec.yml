version: 0.2
phases:
  pre_build:
    commands:
      - test "$(uname -m)" = aarch64
      - test -n "$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
  build:
    commands:
      - docker build --platform linux/arm64 -f harness/Dockerfile -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
      - docker run --rm --network none "$ECR_REPOSITORY_URL:$IMAGE_TAG" opencode --version
      - docker run --rm --network none "$ECR_REPOSITORY_URL:$IMAGE_TAG" go version
      - docker run --rm --network none "$ECR_REPOSITORY_URL:$IMAGE_TAG" python3 -c "import harness.app, harness.runner, harness.tasks"
  post_build:
    commands:
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
