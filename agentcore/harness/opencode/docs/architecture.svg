<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
<title id="title">OpenCode coding harness on Amazon Bedrock AgentCore</title>
<desc id="desc">Cognito and the managed consent portal bind each user to GitHub OAuth in AgentCore Identity. A private AgentCore Runtime runs OpenCode with a parent-held caller JWT, local MCP proxy and independent publishing gates. It uses private endpoints for Kimi K3 Bedrock inference, Gateway tools, image pulls and logs. Gateway uses the user-bound GitHub token to create one commit and a confirmed pull request. CodeBuild builds the immutable image outside the runtime VPC. US inference may cross regions.</desc>
